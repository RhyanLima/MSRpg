<main class="app-shell">
  <section class="page-container">
    <p class="eyebrow">Nova Forja</p>
    <h1>Criar Sistema de RPG</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="create-form">

      <div class="form-group">
        <label for="name">Nome do Sistema</label>
        <input id="name" type="text" formControlName="name" placeholder="Ex: Fantasia Sombria" class="form-control">
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <textarea id="description" formControlName="description" rows="3" class="form-control"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="syncPolicy">Política de Sincronização</label>
          <select id="syncPolicy" formControlName="syncPolicy" class="form-control">
            <option value="APPLY_TO_NEW_ONLY">Apply to New Only</option>
            <option value="CASCADE">Cascade</option>
          </select>
        </div>

        <div class="form-group">
          <label for="settingsJson">Configurações (JSON)</label>
          <input id="settingsJson" type="text" formControlName="settingsJson" class="form-control">
        </div>
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <div class="form-actions">
        <a routerLink="/" class="btn-ghost">Cancelar</a>
        <button type="submit" [disabled]="form.invalid || isSubmitting" class="btn-primary">
          {{ isSubmitting ? 'Forjando...' : 'Criar Sistema' }}
        </button>
      </div>

    </form>
  </section>
</main>
