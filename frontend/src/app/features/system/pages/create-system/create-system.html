<app-system-shell eyebrow="Novo Sistema" heading="Criar Sistema de RPG"
  subtitle="Defina as regras que darão vida às suas campanhas">

  @if (errorMessage(); as message) {
    <div class="alert" role="alert" aria-live="polite">
      <span aria-hidden="true">⚠</span>
      <span>{{ message }}</span>
    </div>
  }

  <p class="note">
    As políticas de resolução e de snapshots são opcionais e podem ser criadas depois.
  </p>

  <app-system-form submitLabel="Forjar Sistema" [busy]="saving()" (saved)="save($event)" />

  <a shellFooter class="foot-link" routerLink="/systems">← Voltar aos sistemas</a>

</app-system-shell>
