<div class="rune-ring" aria-hidden="true"></div>

<div class="particles" aria-hidden="true">
    @for (p of particles; track p.id) {
    <span class="particle" [attr.style]="particleStyle(p)"></span>
    }
</div>

<div class="hero-content">
    <p class="hero-eyebrow" aria-label="Plataforma de RPG Customizável">
        Plataforma de RPG Customizável
    </p>

    <h1>
        Forje o seu<br />
        <span class="accent-gold">Universo</span><br />
        de <span class="accent-ember">RPG</span>
    </h1>

    <p class="hero-sub">
        Crie regras, atributos, itens e sessões do zero —
        <em>do sistema de combate à ficha do personagem</em>,
        tudo sob o seu controle.
    </p>

    <div class="hero-actions">
        <a href="#inicio" class="btn btn-primary">
            <span aria-hidden="true">⚔</span> Criar minha mesa
        </a>
        <a href="#como-funciona" class="btn btn-ghost">
            Ver como funciona
        </a>
    </div>
</div>
